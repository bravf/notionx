limit_req_zone $binary_remote_addr zone=notionx_login:10m rate=5r/m;
server {
    listen 80;
    server_name notionx.mushayu.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name notionx.mushayu.com;
    ssl_certificate /etc/letsencrypt/live/notionx.mushayu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notionx.mushayu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 32m;
    location = /api/session {
        limit_req zone=notionx_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3220;
        include /usr/local/nginx/conf/notionx-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3220;
        include /usr/local/nginx/conf/notionx-proxy.conf;
    }
}
